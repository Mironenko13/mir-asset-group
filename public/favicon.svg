<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="32" height="32" rx="6" fill="#0a1a14"/>
  <defs>
    <clipPath id="gc">
      <circle cx="16" cy="16" r="12.5"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" stroke="#c9a84c" stroke-width="1.4"/>
  <g clip-path="url(#gc)">
    <!-- Equator -->
    <ellipse cx="16" cy="16" rx="13" ry="4.2" stroke="#c9a84c" stroke-width="1.2"/>
    <!-- Upper latitude -->
    <ellipse cx="16" cy="9.5" rx="13" ry="3" stroke="#c9a84c" stroke-width="0.9"/>
    <!-- Lower latitude -->
    <ellipse cx="16" cy="22.5" rx="13" ry="3" stroke="#c9a84c" stroke-width="0.9"/>
    <!-- Vertical meridian -->
    <ellipse cx="16" cy="16" rx="5" ry="13" stroke="#c9a84c" stroke-width="1.2"/>
  </g>
</svg>
